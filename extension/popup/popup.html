<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AVIIN ATS</title>
  <style>
    :root {
      --ink: #0f172a; --ink-soft: #64748b; --rule: #e2e8f0;
      --accent: #2563eb; --good: #16a34a; --good-bg: #f0fdf4; --good-border: #bbf7d0;
      --warn: #b45309; --warn-bg: #fffbeb; --warn-border: #fde68a;
      --err: #dc2626; --err-bg: #fef2f2; --err-border: #fecaca;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px; margin: 0; padding: 16px;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink); background: #fff;
    }
    h1 { font-size: 14px; font-weight: 800; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
    input {
      width: 100%; padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
      border: 1px solid var(--rule); border-radius: 6px; outline: none;
    }
    button {
      width: 100%; padding: 9px; font-size: 13px; font-weight: 700; color: #fff;
      background: var(--accent); border: none; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: #f1f5f9; color: var(--ink); font-weight: 600; margin-top: 6px; }
    .error { color: var(--err); font-size: 12px; margin: -2px 0 8px; }
    .muted { color: var(--ink-soft); font-size: 12px; }
    .status-box { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-top: 10px; line-height: 1.5; }
    .status-box.good { background: var(--good-bg); border: 1px solid var(--good-border); color: #14532d; }
    .status-box.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn); }
    .status-box.err { background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err); }
    a { color: inherit; font-weight: 700; }
    .footer-link { display: block; text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: 12px; text-decoration: none; }
    .user-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .user-row span { font-size: 11.5px; color: var(--ink-soft); }
    .user-row button { width: auto; padding: 4px 8px; font-size: 11px; background: none; color: var(--ink-soft); text-decoration: underline; font-weight: 500; }
  </style>
</head>
<body>
  <h1>🔗 AVIIN ATS Import</h1>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
